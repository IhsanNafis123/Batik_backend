<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BatikFly Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#0f172a,#020617),
    linear-gradient(135deg,#0f172a,#020617);
    overflow:hidden;
}

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    filter:blur(200px);
    opacity:.25;
    top:-150px;
    left:-150px;
}

body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#7c3aed;
    filter:blur(200px);
    opacity:.2;
    bottom:-150px;
    right:-150px;
}

.container{
    width:100%;
    max-width:450px;
    padding:20px;
}

.card{
    position:relative;
    z-index:2;
    background:rgba(15,23,42,.8);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:40px;
    box-shadow:
    0 0 50px rgba(37,99,235,.25);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:white;
    font-size:38px;
    letter-spacing:2px;
}

.logo span{
    color:#60a5fa;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    color:#cbd5e1;
    margin-bottom:8px;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    color:white;
    font-size:15px;
}

.input-group input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 20px rgba(59,130,246,.3);
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    color:white;
    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(59,130,246,.4);
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#64748b;
    font-size:13px;
}

.alert{
    background:#dc2626;
    color:white;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            <h1>BATIK<span>FLY</span></h1>
        </div>

        <p class="subtitle">
            Administrator Dashboard
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/admin/login">

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Masukkan username"
                    required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Masukkan password"
                    required>
            </div>

            <button
                type="submit"
                class="btn">
                LOGIN
            </button>

        </form>

        <div class="footer">
            BatikFly Admin Panel © 2026
        </div>

    </div>

</div>

</body>
</html>
