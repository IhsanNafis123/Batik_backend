<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Verifikasi OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="width: 400px;">
            <h3 class="text-center">Masukkan Kode OTP</h3>
            <p class="text-center text-muted">Kode dikirim ke: <strong>{{ email }}</strong></p>
            <form action="/verifikasi/{{ email }}" method="POST">
                <div class="mb-3">
                    <input type="text" name="otp" class="form-control text-center fs-3" placeholder="000000" required maxlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100">Verifikasi</button>
            </form>
        </div>
    </div>
</body>
</html>
