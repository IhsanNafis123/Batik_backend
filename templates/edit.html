<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User | BatikFly Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          rel="stylesheet">

    <style>

        *{
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:
            radial-gradient(circle at top left,#0f172a,#020617);

            overflow:hidden;
        }

        body::before{
            content:'';
            position:absolute;
            width:500px;
            height:500px;
            background:#2563eb;
            filter:blur(200px);
            opacity:.25;
            top:-200px;
            left:-200px;
        }

        body::after{
            content:'';
            position:absolute;
            width:500px;
            height:500px;
            background:#7c3aed;
            filter:blur(200px);
            opacity:.2;
            bottom:-200px;
            right:-200px;
        }

        .glass-card{
            position:relative;
            z-index:2;

            width:100%;
            max-width:520px;

            background:
            rgba(15,23,42,.8);

            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,.08);

            border-radius:25px;

            box-shadow:
            0 0 40px rgba(37,99,235,.2);

            overflow:hidden;
        }

        .header{
            padding:25px;
            text-align:center;

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            color:white;
        }

        .header h3{
            margin:0;
            font-weight:600;
        }

        .body-content{
            padding:30px;
        }

        .form-label{
            color:#cbd5e1;
            font-size:13px;
            font-weight:600;
        }

        .form-control{
            background:
            rgba(255,255,255,.05);

            border:
            1px solid rgba(255,255,255,.08);

            color:white;
            padding:12px;
        }

        .form-control:focus{
            background:
            rgba(255,255,255,.08);

            color:white;

            border-color:#3b82f6;

            box-shadow:none;
        }

        .form-control::placeholder{
            color:#94a3b8;
        }

        .text-muted{
            color:#94a3b8 !important;
        }

        .btn-save{
            background:
            linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            border:none;
            color:white;
            font-weight:600;
            padding:12px;
        }

        .btn-save:hover{
            color:white;
            transform:translateY(-2px);
        }

        .btn-back{
            background:
            rgba(255,255,255,.05);

            border:
            1px solid rgba(255,255,255,.08);

            color:#cbd5e1;
        }

        .btn-back:hover{
            background:
            rgba(255,255,255,.1);

            color:white;
        }

        .alert{
            border:none;
            border-radius:12px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="glass-card">

        <div class="header">

            <h3>
                <i class="fa-solid fa-user-pen"></i>
                Edit Data User
            </h3>

        </div>

        <div class="body-content">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}

                    <div class="alert alert-{{
                        'success'
                        if category == 'success'
                        else 'danger'
                    }}">
                        {{ message }}
                    </div>

                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/edit-user/{{ user.id }}"
                  method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        value="{{ user.name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        value="{{ user.email }}"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Password Baru
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        minlength="8"
                        maxlength="12"
                        placeholder="Kosongkan jika tidak diubah">

                    <small class="text-muted">
                        Minimal 8 karakter, maksimal 12 karakter
                    </small>

                </div>

                <button
                    type="submit"
                    class="btn btn-save w-100 mb-3">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Simpan Perubahan

                </button>

                <a href="/dashboard"
                   class="btn btn-back w-100">

                    <i class="fa-solid fa-arrow-left"></i>
                    Kembali ke Dashboard

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
