<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desain User</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet">

<style>

*{
    font-family:'Poppins',sans-serif;
}

body{

    background:
    radial-gradient(circle at top left,#0f172a,#020617);

    min-height:100vh;

    color:white;
}

.glass-card{

    background:
    rgba(15,23,42,.8);

    backdrop-filter:
    blur(20px);

    border:
    1px solid rgba(255,255,255,.08);

    border-radius:20px;

    box-shadow:
    0 0 25px rgba(37,99,235,.15);
}

.design-card{

    overflow:hidden;

    transition:.3s;
}

.design-card:hover{

    transform:translateY(-5px);

    box-shadow:
    0 0 30px rgba(59,130,246,.3);
}

.design-image{

    width:100%;

    height:250px;

    object-fit:cover;
}

.page-title{

    font-size:36px;

    font-weight:700;
}

.page-sub{

    color:#94a3b8;
}

.btn-custom{

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
    );

    border:none;

    color:white;
}

.btn-custom:hover{

    opacity:.9;

    color:white;
}

</style>

</head>

<body>

<div class="container py-5">

    <a href="/dashboard"
       class="btn btn-secondary mb-4">

       <i class="fa-solid fa-arrow-left"></i>
       Kembali
    </a>

    <h1 class="page-title">

        Desain Milik {{ user.name }}

    </h1>

    <p class="page-sub">

        {{ user.email }}

    </p>

    <div class="row mt-4">

        {% for design in designs %}

        <div class="col-lg-4 col-md-6 mb-4">

            <div class="glass-card design-card">

                <img
                    src="{{ design.image_url }}"
                    class="design-image">

                <div class="p-3">

                    <h5>

                        {{ design.motif_name }}

                    </h5>

                    <small class="text-secondary">

                        {{ design.created_at }}

                    </small>

                    <hr>

                    <div class="d-flex gap-2">

                        <a href="/admin/design-detail/{{ design.id }}"
                           class="btn btn-custom w-100">

                            <i class="fa-solid fa-eye"></i>
                            Detail

                        </a>

                        <a href="/admin/delete-design/{{ design.id }}"
                           class="btn btn-danger"
                           onclick="return confirm('Hapus desain ini?')">

                            <i class="fa-solid fa-trash"></i>

                        </a>

                    </div>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
